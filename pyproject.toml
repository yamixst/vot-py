[project]
name = "vot-py"
version = "0.1.0"
description = "A Python port of the vot.js library for interacting with Yandex Video Translation API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.24.0",
    "protobuf>=4.21.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "types-protobuf>=4.21.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vot"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["src/vot/protobuf/*_pb2.py"]

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
exclude = "^src/vot/protobuf/"

[project.scripts]
vot = "vot.cli:main"
